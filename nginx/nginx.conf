upstream loadbalancer {
    # Round-robin по умолчанию последовательно распределяет запросы между backend.
    server app1:8080;
    server app2:8080;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Сертификат и ключ копируются в образ nginx его Dockerfile.
    ssl_certificate     /etc/nginx/certs/www.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/www.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://loadbalancer;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
